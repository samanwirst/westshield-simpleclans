replacement: '****'
# Owner-supplied files under steam/; dictionary data is not bundled or downloaded at runtime.
external-steam-dictionaries: false
# Additional literal words; no regex or remote dictionary requests at runtime.
extra-words: []
allow-words: []
teleport-grace-seconds: 5
# Only observed anti-cheat kicks count. Authentication/network/manual kicks do not.
permanent-ban-after-kicks: 3
# Ordinary messages retain their format and reach only players within this 3D radius.
# A leading ! sends to all authenticated players with a [Global] label.
local-chat-radius: 100
