name: Manual live protocol clients

on:
  workflow_dispatch:
    inputs:
      control_url:
        description: Temporary read-only HTTPS control document
        required: true
        type: string
      names:
        description: JSON array of three explicitly whitelisted temporary names
        required: true
        type: string
      beacon:
        description: Unique diagnostic marker
        required: true
        type: string

permissions:
  contents: read

jobs:
  clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WESTSHIELD_CONTROL_URL: ${{ inputs.control_url }}
      WESTSHIELD_NAMES: ${{ inputs.names }}
      WESTSHIELD_BEACON: ${{ inputs.beacon }}
      WESTSHIELD_TEST_PASSWORD: ${{ secrets.WESTSHIELD_LIVE_TEST_PASSWORD }}
    steps:
      - name: Run temporary non-OP Java protocol clients
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch westshield-26.2 https://github.com/samanwirst/westshield-simpleclans.git source
          python3 -m venv /tmp/westshield-clients
          /tmp/westshield-clients/bin/pip install nbtlib==2.0.4 requests==2.34.2
          /tmp/westshield-clients/bin/python source/westshield/tests/integration/remote_agent.py
