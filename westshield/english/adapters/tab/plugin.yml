name: WestShieldTab
version: 1.0.0
main: com.westshield.tab.WestShieldTab
api-version: '26.2'
author: WestShield
description: Authenticated TAB statistics and a Bedrock information panel.
depend: [TAB, AuthMe, Plan, SimpleClans, WestShieldClanTerritories]
softdepend: [floodgate]
commands:
  westshield:
    aliases: [serverinfo]
    description: Show your server, playtime and clan information.
    permission: westshieldtab.use
permissions:
  westshieldtab.use:
    default: true
  westshieldtab.admin:
    default: op
