# Overlay for BlueMap 5.29's overworld map configuration.
# Preserve the deployment's world, storage, render mask and marker configuration.
# Perspective is needed by the renderer to retain exterior block side faces.
# westshield-map-v3.js exposes only fixed orthographic browser views.
enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: false
sky-light: 1
ambient-light: 0.18
