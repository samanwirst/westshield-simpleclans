player-count-settings {
  disable-player-list-hover=false
  fake-players { fake-players-enabled=false, fake-players="0" }
  hide-player-count=false
  just-x-more-settings { just-x-more-enabled=false, x-value=0 }
  max-players=200
  max-players-enabled=false
