name: WiutWorldRules
version: 1.1.1
main: com.wiut.rules.WiutWorldRules
api-version: '26.2'
description: Persistent WIUT borders, locator privacy and reversible End access control.
author: WIUT
depend:
- Geyser-Spigot
commands:
  wiutworldrules:
    description: Inspect rules, reload configuration, or open/close End access.
    usage: /wiutworldrules <status|reload|end open|end close>
    permission: wiutworldrules.admin
permissions:
  wiutworldrules.admin:
    default: op
