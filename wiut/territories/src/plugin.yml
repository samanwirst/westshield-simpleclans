name: WiutClanTerritories
version: '1.0.0'
main: com.wiut.clans.territory.WiutClanTerritories
api-version: '1.21'
depend: [SimpleClans, AuthMe, BlueMap]
authors: [samanwirst]
description: Administrative polygon labels with no land protection.
commands:
  clanterritory:
    description: Mark and manage informational clan polygons.
    aliases: [cterr]
    permission: wiutclans.admin
    usage: /clanterritory help
  clanadmin:
    description: Create clans for players and set the shared chat/map clan color.
    permission: wiutclans.admin
    usage: /clanadmin create <tag> <leader> <name>
