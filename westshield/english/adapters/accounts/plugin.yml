name: WestShieldAccounts
version: 1.0.0
main: com.westshield.accounts.WestShieldAccounts
api-version: '26.2'
author: WestShield
depend: [AuthMe, floodgate]
description: Uses one AuthMe-protected profile for matching Java and Bedrock names.
commands:
  westshieldaccounts:
    description: Shows the shared-account adapter status.
    permission: westshieldaccounts.admin
permissions:
  westshieldaccounts.admin:
    default: op
