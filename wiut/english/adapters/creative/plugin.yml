name: WiutCreative
version: 1.0.2
main: com.wiut.creative.WiutCreative
api-version: '26.2'
depend: [Multiverse-Core, Multiverse-Inventories, GriefPrevention, AuthMe]
softdepend: [GSit]
commands:
  creative:
    description: Enter the shared creative world with a separate inventory.
    usage: /creative
    permission: wiutcreative.travel
  survival:
    description: Return to the previous survival dimension and position.
    usage: /survival
    permission: wiutcreative.travel
  wiutcreative:
    description: Show creative world policy status.
    permission: wiutcreative.admin
permissions:
  wiutcreative.travel:
    default: true
  wiutcreative.admin:
    default: op
