name: WestShieldLoot
version: 1.0.0
main: com.westshield.loot.WestShieldLoot
api-version: '26.2'
author: WestShield
description: Permanent, account-bound personal loot for natural structure containers.
depend: [AuthMe, WestShieldAccounts]
softdepend: [floodgate]
libraries:
  - org.xerial:sqlite-jdbc:3.49.1.0
commands:
  westshieldloot:
    description: Inspect the natural loot registry and its delivery state.
    permission: westshieldloot.admin
    usage: /westshieldloot status | inspect
permissions:
  westshieldloot.admin:
    default: op
